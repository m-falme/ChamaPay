<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChamaPay{% block title %}{% endblock %}</title>
<style>
:root{--g:#0f7b5f;--gl:#e6f4ef;--r:#c0392b;--rl:#fdecea;--y:#b7791f;--yl:#fdf6e3;--t:#1d2b36;--m:#6b7a86;--b:#e3e8ec}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--t);background:#f5f7f8}
header{background:var(--g);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header b{font-size:18px}header form{margin:0}main{max-width:1100px;margin:0 auto;padding:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.card,section{background:#fff;border:1px solid var(--b);border-radius:10px;padding:14px}
.card small{color:var(--m)}.card div{font-size:22px;font-weight:700}
section{margin-bottom:16px;overflow-x:auto}h2{font-size:16px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--b);white-space:nowrap}
th{color:var(--m);font-weight:600}td.wrap{white-space:normal;min-width:220px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600}
.ok{background:var(--gl);color:var(--g)}.bad{background:var(--rl);color:var(--r)}.wait{background:var(--yl);color:var(--y)}
button,.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;border:1px solid #fff}button.sm{padding:4px 10px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.flash{padding:10px 12px;border-radius:8px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
input{padding:10px;border:1px solid var(--b);border-radius:8px;width:100%;font-size:16px}
.addm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.addm input[name]{flex:1 1 200px}.addm label{display:flex;gap:6px;align-items:center}
</style></head><body>
<header><b>ChamaPay</b>{% if session.auth %}<form method="post" action="{{ url_for('dashboard.logout') }}"><button class="ghost sm">Log out</button></form>{% endif %}</header>
<main>
{% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash {{ 'bad' if cat=='error' else 'ok' }}">{{ msg }}</div>{% endfor %}
{% block body %}{% endblock %}
</main></body></html>
