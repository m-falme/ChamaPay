<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChamaPay{% block title %}{% endblock %}</title>
<style>
:root{--g:#0f7b5f;--gl:#e3f3ec;--r:#b42318;--rl:#fde8e6;--y:#8a5a00;--yl:#fff4d6;--t:#14212b;--m:#5b6b78;--b:#dfe5ea}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--t);background:#f3f6f8}
header{background:var(--g);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header b{font-size:22px;letter-spacing:.3px}header form{margin:0}main{max-width:1200px;margin:0 auto;padding:20px}
h1{font-size:26px;margin:0 0 2px}.sub{color:var(--m);margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.card,section{background:#fff;border:1px solid var(--b);border-radius:12px;padding:16px}
.card small{color:var(--m);font-size:14px;text-transform:uppercase;letter-spacing:.4px}.card div{font-size:28px;font-weight:800;margin-top:2px}
.card.alert div{color:var(--r)}section{margin-bottom:18px;overflow-x:auto}h2{font-size:18px;margin:0 0 12px;display:flex;gap:8px;align-items:center}
.count{background:#eef2f5;color:var(--m);border-radius:99px;padding:0 9px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--b);white-space:nowrap;vertical-align:top}
th{color:var(--m);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.3px}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}td.wrap{white-space:normal;min-width:260px}
tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700}
.ok{background:var(--gl);color:var(--g)}.bad{background:var(--rl);color:var(--r)}.wait{background:var(--yl);color:var(--y)}
button{background:var(--g);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer}
button:hover{filter:brightness(1.08)}button.ghost{background:transparent;border:1px solid #fff}button.sm{padding:5px 12px;font-size:14px}button.alt{background:#24506b}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.flash{padding:12px 14px;border-radius:10px;margin-bottom:14px;font-weight:600}
.banner{background:var(--yl);color:var(--y);border:1px solid #f1d58a;padding:10px 14px;border-radius:10px;margin-bottom:14px}
.empty{color:var(--m);font-style:italic;padding:8px 0}.grid2{display:grid;grid-template-columns:3fr 2fr;gap:18px}@media(max-width:860px){.grid2{grid-template-columns:1fr}}
input{padding:10px;border:1px solid var(--b);border-radius:9px;width:100%;font-size:16px}
.addm{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.addm input[name]{flex:1 1 220px}.addm label{display:flex;gap:6px;align-items:center;white-space:nowrap}
</style></head><body>
<header><b>ChamaPay</b>{% if session.auth %}<form method="post" action="{{ url_for('dashboard.logout') }}"><button class="ghost sm">Log out</button></form>{% endif %}</header>
<main>
{% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash {{ 'bad' if cat=='error' else 'ok' }}">{{ msg }}</div>{% endfor %}
{% block body %}{% endblock %}
</main></body></html>
